<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Theory falsification map</title><desc id="desc">Theory families feed into preregistered divergent-prediction tests with rival-specific failure, shared support, or unique-survivor outcomes.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6c7f91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Theory comparison and falsification map</tspan></text><text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5f758a"><tspan x="800" dy="0">The program compares commitments by preregistered divergent predictions</tspan></text><rect id="theory-1" x="55" y="190" width="250" height="135" rx="20" fill="#3576a8" stroke="none" stroke-width="0"/><text x="180" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white"><tspan x="180" dy="0">Workspace</tspan></text><text x="180" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="white"><tspan x="180" dy="0">Global availability / broadcast</tspan></text><path d="M 180 325 L 800 440" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="theory-2" x="355" y="190" width="250" height="135" rx="20" fill="#8467b3" stroke="none" stroke-width="0"/><text x="480" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white"><tspan x="480" dy="0">Integrated causal</tspan></text><text x="480" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="white"><tspan x="480" dy="0">Irreducible causal organization</tspan></text><path d="M 480 325 L 800 440" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="theory-3" x="655" y="190" width="250" height="135" rx="20" fill="#56a8be" stroke="none" stroke-width="0"/><text x="780" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white"><tspan x="780" dy="0">Recurrent processing</tspan></text><text x="780" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="white"><tspan x="780" dy="0">Recurrent or feedback dynamics</tspan></text><path d="M 780 325 L 800 440" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="theory-4" x="955" y="190" width="250" height="135" rx="20" fill="#df8234" stroke="none" stroke-width="0"/><text x="1080" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white"><tspan x="1080" dy="0">Higher-order</tspan></text><text x="1080" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="white"><tspan x="1080" dy="0">Representation of lower-order states</tspan></text><path d="M 1080 325 L 800 440" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="theory-5" x="1255" y="190" width="250" height="135" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><text x="1380" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white"><tspan x="1380" dy="0">Structural correspondence</tspan></text><text x="1380" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="white"><tspan x="1380" dy="0">Relational structure across domains</tspan></text><path d="M 1380 325 L 800 440" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="preregistered-test" x="520" y="440" width="560" height="160" rx="24" fill="#17324d" stroke="none" stroke-width="0"/><text x="800" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="white"><tspan x="800" dy="0">Preregistered divergent-prediction test</tspan></text><text x="800" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="800" dy="0">Same acquisition and analysis plan</tspan><tspan x="800" dy="19.2">Locked primary outcomes</tspan><tspan x="800" dy="19.2">Explicit rival predictions</tspan></text><rect id="falsification-rival-specific-failure" x="150" y="720" width="330" height="150" rx="20" fill="#c2617b" stroke="none" stroke-width="0"/><text x="315" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="white"><tspan x="315" dy="0">Rival-specific failure</tspan></text><text x="315" y="802" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="315" dy="0">A unique prediction fails</tspan><tspan x="315" dy="18.0">under adequate power</tspan></text><path d="M 800 600 L 315 720" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="falsification-shared-support" x="635" y="720" width="330" height="150" rx="20" fill="#d59d33" stroke="none" stroke-width="0"/><text x="800" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="white"><tspan x="800" dy="0">Shared support</tspan></text><text x="800" y="802" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="800" dy="0">Several theories predict</tspan><tspan x="800" dy="18.0">the same observed pattern</tspan></text><path d="M 800 600 L 800 720" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="falsification-unique-survivor" x="1120" y="720" width="330" height="150" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><text x="1285" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="white"><tspan x="1285" dy="0">Unique survivor</tspan></text><text x="1285" y="802" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="1285" dy="0">One preregistered prediction</tspan><tspan x="1285" dy="18.0">survives while relevant rivals fail</tspan></text><path d="M 800 600 L 1285 720" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#c2617b"><tspan x="800" dy="0">Even M7 remains a model-relative empirical result; it does not directly measure qualia or settle ontology</tspan></text></svg>