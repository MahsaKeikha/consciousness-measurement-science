<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Research III program map</title><desc id="desc">Declared targets flow through multimodal evidence, assumptions, identification, validation, and claim discipline.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6c7f91"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#172033}.w{font-weight:700;fill:#fff}.s{fill:#fff}.g{fill:#5f758a}</style><text class="h" x="800" y="70" text-anchor="middle" font-size="34">Research III: consciousness measurement science</text><text class="g" x="800" y="112" text-anchor="middle" font-size="20">Targets, evidence, assumptions, identification, validation, and claims remain explicit</text><g id="targets"><rect x="70" y="180" width="250" height="110" rx="20" fill="#c2617b"/><rect x="370" y="180" width="250" height="110" rx="20" fill="#3576a8"/><rect x="670" y="180" width="250" height="110" rx="20" fill="#df8234"/><rect x="970" y="180" width="250" height="110" rx="20" fill="#8467b3"/><rect x="1270" y="180" width="250" height="110" rx="20" fill="#62a66a"/><text class="w" x="195" y="236" text-anchor="middle" font-size="23">Presence</text><text class="w" x="495" y="236" text-anchor="middle" font-size="23">Global state</text><text class="w" x="795" y="236" text-anchor="middle" font-size="23">Content</text><text class="w" x="1095" y="236" text-anchor="middle" font-size="21">Phenomenal structure</text><text class="w" x="1395" y="236" text-anchor="middle" font-size="23">Capacity</text><text class="s" x="195" y="267" text-anchor="middle" font-size="15">declared target</text><text class="s" x="495" y="267" text-anchor="middle" font-size="15">declared target</text><text class="s" x="795" y="267" text-anchor="middle" font-size="15">declared target</text><text class="s" x="1095" y="267" text-anchor="middle" font-size="15">declared target</text><text class="s" x="1395" y="267" text-anchor="middle" font-size="15">declared target</text></g><g stroke="#6c7f91" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M195 290L640 370"/><path d="M495 290L720 370"/><path d="M795 290L800 370"/><path d="M1095 290L880 370"/><path d="M1395 290L960 370"/></g><rect x="145" y="370" width="1310" height="150" rx="28" fill="#eef4f8" stroke="#cad7e3" stroke-width="2"/><text class="h" x="800" y="414" text-anchor="middle" font-size="27">Multimodal observable evidence</text><g fill="#fff" stroke="#bdc9d5" stroke-width="2"><rect x="210" y="445" width="250" height="52" rx="12"/><rect x="515" y="445" width="250" height="52" rx="12"/><rect x="820" y="445" width="250" height="52" rx="12"/><rect x="1125" y="445" width="250" height="52" rx="12"/></g><g class="h" text-anchor="middle" font-size="16"><text x="335" y="478">Report + behavior</text><text x="640" y="478">Neural activity</text><text x="945" y="478">Perturbation</text><text x="1250" y="478">Physiology + context</text></g><g id="stages"><rect x="170" y="630" width="280" height="145" rx="20" fill="#d59d33"/><rect x="490" y="630" width="280" height="145" rx="20" fill="#56a8be"/><rect x="810" y="630" width="280" height="145" rx="20" fill="#62a66a"/><rect x="1130" y="630" width="280" height="145" rx="20" fill="#17324d"/><g class="w" text-anchor="middle"><text x="310" y="674" font-size="22">Assumption registry</text><text x="630" y="674" font-size="22">Identification</text><text x="950" y="674" font-size="22">Validation</text><text x="1270" y="674" font-size="22">Claim discipline</text></g><g class="s" text-anchor="middle" font-size="15"><text x="310" y="712">What must be true?</text><text x="310" y="735">What can fail?</text><text x="630" y="712">Point estimate, bounds,</text><text x="630" y="735">or abstention</text><text x="950" y="712">Holdout, transport,</text><text x="950" y="735">causal tests</text><text x="1270" y="712">M0-M7 ladder</text><text x="1270" y="735">and explicit nonclaims</text></g></g><g stroke="#6c7f91" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M800 520L310 630"/><path d="M450 702L490 702"/><path d="M770 702L810 702"/><path d="M1090 702L1130 702"/></g><text class="h" x="800" y="865" text-anchor="middle" font-size="22">Allowed output: support, opposition, model-relative rejection, bounded uncertainty, or inconclusive result</text><text x="800" y="910" text-anchor="middle" font-size="19" fill="#c2617b">Not licensed: direct third-person access to qualia or an ontological identity claim</text></svg>