<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Target evidence matrix</title><desc id="desc">Target-specific roles for report, behavior, neural, perturbational, and physiological evidence.</desc><rect width="1600" height="1000" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#172033}.w{font-weight:700;fill:#fff}.s{fill:#fff}.c{fill:#f7f9fc;stroke:#ccd7e2;stroke-width:2}</style><text class="h" x="800" y="70" text-anchor="middle" font-size="34">Target-evidence matrix</text><text x="800" y="112" text-anchor="middle" font-size="20" fill="#5f758a">A channel can be informative for one target and insufficient for another</text><g class="w" text-anchor="middle" font-size="18"><rect x="300" y="170" width="220" height="58" rx="12" fill="#17324d"/><rect x="535" y="170" width="220" height="58" rx="12" fill="#17324d"/><rect x="770" y="170" width="220" height="58" rx="12" fill="#17324d"/><rect x="1005" y="170" width="220" height="58" rx="12" fill="#17324d"/><rect x="1240" y="170" width="220" height="58" rx="12" fill="#17324d"/><text x="410" y="207">Report</text><text x="645" y="207">Behavior</text><text x="880" y="207">Neural</text><text x="1115" y="207">Perturbation</text><text x="1350" y="207">Physiology</text></g><g id="row-labels" class="w" text-anchor="middle"><rect x="65" y="255" width="200" height="115" rx="16" fill="#c2617b"/><rect x="65" y="385" width="200" height="115" rx="16" fill="#3576a8"/><rect x="65" y="515" width="200" height="115" rx="16" fill="#df8234"/><rect x="65" y="645" width="200" height="115" rx="16" fill="#8467b3"/><rect x="65" y="775" width="200" height="115" rx="16" fill="#62a66a"/><text x="165" y="320" font-size="19">Presence</text><text x="165" y="450" font-size="19">Global state</text><text x="165" y="580" font-size="19">Content</text><text x="165" y="700" font-size="16">Phenomenal</text><text x="165" y="724" font-size="16">structure</te