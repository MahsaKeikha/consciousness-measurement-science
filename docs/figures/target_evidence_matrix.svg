" y="836">Anchor</text><text x="1115" y="836">Anchor</text><text x="1350" y="836">Support</text></g></g><text x="800" y="930" text-anchor="middle" font-size="17" fill="#5f758a">Anchor = strongest direct measurement relationship in the declared scope; Support = informative but not sufficient; Limited = context dependent</text><text x="800" y="967" text-anchor="middle" font-size="20" font-weight="700" fill="#c2617b">No single row or column licenses a universal consciousness score</text></svg>