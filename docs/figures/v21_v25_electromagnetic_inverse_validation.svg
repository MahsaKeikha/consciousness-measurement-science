<text x="82" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Reference invariance</text>
<text x="82" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#315b78">1.38e-14</text>
<text x="82" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">max pairwise-difference error</text>
<rect x="500" y="172" width="400" height="150" rx="12" fill="#ffffff" stroke="#d6dde7" stroke-width="1.2"/>
<text x="522" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#51683f">V22</text>
<text x="522" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Source non-identifiability</text>
<text x="522" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#51683f">rank 3 / nullity 3</text>
<text x="522" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">zero sensor residual; source separation 1</text>
<rect x="940" y="172" width="400" height="150" rx="12" fill="#ffffff" stroke="#d6dde7" stroke-width="1.2"/>
<text x="962" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7a425c">V24</text>
<text x="962" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Multimodal complementarity</text>
<text x="962" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7a425c">nullity 3 + 3 to 1</text>
<text x="962" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">ambiguity reduced, not eliminated</text>
