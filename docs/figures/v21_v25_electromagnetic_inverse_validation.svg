<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60" y="56" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3156a3">Research III V21-V25</text>
<text x="60" y="92" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#172236">Electromagnetic forward and inverse limits</text>
<text x="60" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#657286">Reference invariance, source ambiguity, regularization sensitivity,</text>
<text x="60" y="140" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#657286">multimodal complementarity, and forward-model error.</text>
<line x1="60" y1="155" x2="1340" y2="155" stroke="#d6dde7" stroke-width="1.2"/>
