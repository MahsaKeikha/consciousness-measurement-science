<text x="1027" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Frequency specificity</text>
<text x="1027" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#5b5791">10 Hz: 1 | 17 Hz: 0</text>
<text x="1027" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">organization depends on frequency</text>
