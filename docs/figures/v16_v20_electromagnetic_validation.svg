<text x="86" y="388" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#244c64">V19  Common-mode confound stress test</text>
<text x="86" y="414" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#687588">A shared contaminant can create apparent phase organization at the sensor level</text>
