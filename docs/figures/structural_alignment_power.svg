<svg xmlns="http://www.w3.org/2000/svg" width="1000.000" height="622.222" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Relational-geometry permutation test: null and power behavior</title>
<desc id="desc">Rejection rate across synthetic signal strengths using a permutation test on distance-matrix alignment.</desc>
<style>
