<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Consciousness measurement architecture</title>
<desc id="desc">A latent experiential target is inferred from first-person report, behavior, neural data, perturbational response, physiology, interventions, and context. The output is a target-specific claim with uncertainty and assumptions rather than a direct qualia reading.</desc>
<defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .h{font-size:30px;font-weight:700}
    .b{font-size:17px;font-weight:700}
    .s{font-size:13.5px}
    .s2{font-size:15px}
    .box{fill:#fff;stroke:#111827;stroke-width:2}
    .latent{fill:#f3f4f6;stroke:#111827;stroke-width:3}
    .out{fill:#eef2ff;stroke:#3730a3;stroke-width:2}
    .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
    <path d="M0.8,0.8 L7.2,4 L0.8,7.2 z" fill="#374151"/>
  </marker>
</defs>

<rect width="1200" height="640" fill="#ffffff"/>
<text x="50" y="55" class="h">What can a consciousness measurement actually observe?</text>

<rect x="350" y="92" rx="18" ry="18" width="500" height="108" class="latent" data-node="latent"/>
<text x="600" y="129" text-anchor="middle" class="b" data-parent="latent">Latent experiential target E</text>
<text x="600" y="156" text-anchor="middle" class="s2" data-parent="latent">presence · state · content</text>
<text x="600" y="178" text-anchor="middle" class="s2" data-parent="latent">structure · capacity</text>

<g aria-label="Observable evidence channels">
  <rect x="28" y="244" width="184" height="96" rx="12" class="box" data-node="report"/>
  <text x="120" y="278" text-anchor="middle" class="b" data-parent="report">Report R</text>
  <text x="120" y="311" text-anchor="middle" class="s" data-parent="report">first-person anchor</text>

  <rect x="220" y="244" width="184" height="96" rx="12" class="box" data-node="behavior"/>
  <text x="312" y="278" text-anchor="middle" class="b" data-parent="behavior">Behavior B</text>
  <text x="312" y="311" text-anchor="middle" class="s" data-parent="behavior">intentional output</text>

  <rect x="412" y="244" width="184" height="96" rx="12" class="box" data-node="neural"/>
  <text x="504" y="278" text-anchor="middle" class="b" data-parent="neural">Neural N</text>
  <text x="504" y="311" text-anchor="middle" class="s" data-parent="neural">EEG · fMRI · MEG</text>

  <rect x="604" y="244" width="184" height="96" rx="12" class="box" data-node="perturbation"/>
  <text x="696" y="278" text-anchor="middle" class="b" data-parent="perturbation">Perturbation P</text>
  <text x="696" y="311" text-anchor="middle" class="s" data-parent="perturbation">TMS + EEG response</text>

  <rect x="796" y="244" width="184" height="96" rx="12" class="box" data-node="physiology"/>
  <text x="888" y="278" text-anchor="middle" class="b" data-parent="physiology">Physiology A</text>
  <text x="888" y="311" text-anchor="middle" class="s" data-parent="physiology">eye · ECG · EDA</text>

  <rect x="988" y="244" width="184" height="96" rx="12" class="box" data-node="context"/>
  <text x="1080" y="278" text-anchor="middle" class="b" data-parent="context">Context C</text>
  <text x="1080" y="304" text-anchor="middle" class="s" data-parent="context">state · task</text>
  <text x="1080" y="323" text-anchor="middle" class="s" data-parent="context">injury</text>
</g>

<path d="M430 200 L120 244" class="line"/>
<path d="M500 200 L312 244" class="line"/>
<path d="M565 200 L504 244" class="line"/>
<path d="M635 200 L696 244" class="line"/>
<path d="M700 200 L888 244" class="line"/>

<rect x="180" y="390" width="840" height="98" rx="16" class="out" data-node="cep"/>
<text x="600" y="426" text-anchor="middle" class="b" data-parent="cep">Consciousness Evidence Profile (CEP)</text>
<text x="600" y="454" text-anchor="middle" class="s2" data-parent="cep">multimodal evidence + quality + uncertainty</text>
<text x="600" y="476" text-anchor="middle" class="s2" data-parent="cep">validation domain + assumptions</text>

<path d="M120 340 L350 390" class="line"/>
<path d="M312 340 L430 390" class="line"/>
<path d="M504 340 L530 390" class="line"/>
<path d="M696 340 L670 390" class="line"/>
<path d="M888 340 L770 390" class="line"/>
<path d="M1080 340 L850 390" class="line"/>

<rect x="290" y="530" width="620" height="82" rx="16" class="out" data-node="output"/>
<text x="600" y="561" text-anchor="middle" class="b" data-parent="output">Allowed scientific output</text>
<text x="600" y="590" text-anchor="middle" class="s2" data-parent="output">supporting · opposing · mixed/dissociated · inconclusive</text>
<path d="M600 488 L600 530" class="line"/>
</svg>