<svg xmlns="http://www.w3.org/2000/svg" width="1000.000" height="622.222" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Finite-sample coverage stress test</title>
<desc id="desc">Empirical coverage of the conservative interval, with a dashed 0.95 nominal reference line.</desc>
<style>
.bg{fill:#ffffff}.panel{fill:#f8fafc;stroke:#d7dee8;stroke-width:1}.axis{stroke:#334155;stroke-width:1.2}.grid{stroke:#dbe3ec;stroke-width:1}.txt{font-family:Arial,Helvetica,sans-serif;fill:#172033}.small{font-size:13px}.label{font-size:15px;font-weight:600}.title{font-size:21px;font-weight:700}.line1{fill:none;stroke:#0f5f78;stroke-width:3}.line2{fill:none;stroke:#9a4e0d;stroke-width:3}.line3{fill:none;stroke:#6b4fa3;stroke-width:3}.dot1{fill:#0f5f78}.dot2{fill:#9a4e0d}.dot3{fill:#6b4fa3}.ref{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 5}.zero{stroke:#111827;stroke-width:1.4}.heattext{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#172033;text-anchor:middle}.note{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#475569}
</style>
<rect class="bg" width="100%" height="100%"/>
<rect class="panel" x="90" y="85" width="770" height="390" rx="8"/>
<line class="grid" x1="90" y1="475.0" x2="860" y2="475.0"/>
<text class="txt small" x="78" y="479.0" text-anchor="end">0.90</text>
<line class="grid" x1="90" y1="397.0" x2="860" y2="397.0"/>
<text class="txt small" x="78" y="401.0" text-anchor="end">0.92</text>
<line class="grid" x1="90" y1="319.0" x2="860" y2="319.0"/>
<text class="txt small" x="78" y="323.0" text-anchor="end">0.94</text>
<line class="grid" x1="90" y1="241.0" x2="860" y2="241.0"/>
<text class="txt small" x="78" y="245.0" text-anchor="end">0.96</text>
<line class="grid" x1="90" y1="163.0" x2="860" y2="163.0"/>
<text class="txt small" x="78" y="167.0" text-anchor="end">0.98</text>
<line class="grid" x1="90" y1="85.0" x2="860" y2="85.0"/>
<text class="txt small" x="78" y="89.0" text-anchor="end">1.00</text>
<line class="grid" x1="90.0" y1="85" x2="90.0" y2="475"/>
<text class="txt small" x="90.0" y="500" text-anchor="middle">50</text>
<line class="grid" x1="226.4" y1="85" x2="226.4" y2="475"/>
<text class="txt small" x="226.4" y="500" text-anchor="middle">100</text>
<line class="grid" x1="406.8" y1="85" x2="406.8" y2="475"/>
<text class="txt small" x="406.8" y="500" text-anchor="middle">250</text>
<line class="grid" x1="543.2" y1="85" x2="543.2" y2="475"/>
<text class="txt small" x="543.2" y="500" text-anchor="middle">500</text>
<line class="grid" x1="679.6" y1="85" x2="679.6" y2="475"/>
<text class="txt small" x="679.6" y="500" text-anchor="middle">1000</text>
<line class="grid" x1="860.0" y1="85" x2="860.0" y2="475"/>
<text class="txt small" x="860.0" y="500" text-anchor="middle">2500</text>
<line class="ref" x1="90" y1="280.0" x2="860" y2="280.0"/>
<line class="axis" x1="90" y1="475" x2="860" y2="475"/>
<line class="axis" x1="90" y1="85" x2="90" y2="475"/>
<text class="txt title" x="90" y="42">Finite-sample coverage stress test</text>
<text class="txt label" x="475.0" y="532" text-anchor="middle">sample size n (log scale)</text>
<text class="txt label" transform="translate(26 280.0) rotate(-90)" text-anchor="middle">coverage</text>
<polyline class="line1" points="90.0,89.7 226.4,89.7 406.8,85.0 543.2,85.0 679.6,85.0 860.0,85.0"/>
<circle class="dot1" cx="90.0" cy="89.7" r="4"/>
<circle class="dot1" cx="226.4" cy="89.7" r="4"/>
<circle class="dot1" cx="406.8" cy="85.0" r="4"/>
<circle class="dot1" cx="543.2" cy="85.0" r="4"/>
<circle class="dot1" cx="679.6" cy="85.0" r="4"/>
<circle class="dot1" cx="860.0" cy="85.0" r="4"/>
<line class="line1" x1="102" y1="62" x2="130" y2="62"/>
<text class="txt small" x="138" y="66">empirical coverage</text>
</svg>