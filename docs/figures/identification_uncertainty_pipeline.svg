<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Identification and uncertainty pipeline</title><desc id="desc">Pipeline showing observed evidence and assumptions leading to point identification, partial identification, or abstention.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6c7f91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Identification and uncertainty pipeline</tspan></text><text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5f758a"><tspan x="800" dy="0">When the assumptions do not identify a unique answer, the output should remain a set</tspan></text><rect id="ident-observed-evidence" x="90" y="240" width="240" height="150" rx="20" fill="#3576a8" stroke="none" stroke-width="0"/><text x="210" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="210" dy="0">Observed evidence</tspan></text><text x="210" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="210" dy="0">R, B, N, P, A</tspan><tspan x="210" dy="18.0">with quality flags</tspan></text><rect id="ident-declared-assumptions" x="390" y="240" width="240" height="150" rx="20" fill="#d59d33" stroke="none" stroke-width="0"/><text x="510" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="510" dy="0">Declared assumptions</tspan></text><text x="510" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="510" dy="0">Dependence, sensitivity,</tspan><tspan x="510" dy="18.0">calibration, transport</tspan></text><rect id="ident-identification-analysis" x="690" y="240" width="240" height="150" rx="20" fill="#8467b3" stroke="none" stroke-width="0"/><text x="810" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="810" dy="0">Identification analysis</tspan></text><text x="810" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="810" dy="0">What values remain</tspan><tspan x="810" dy="18.0">compatible with evidence?</tspan></text><rect id="ident-validation-checks" x="990" y="240" width="240" height="150" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><text x="1110" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="1110" dy="0">Validation checks</tspan></text><text x="1110" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="1110" dy="0">Holdout, invariance,</tspan><tspan x="1110" dy="18.0">causal and transport tests</tspan></text><path d="M 330 315 L 390 315" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><path d="M 630 315 L 690 315" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><path d="M 930 315 L 990 315" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect x="570" y="520" width="460" height="90" rx="20" fill="#17324d" stroke="none" stroke-width="0"/><text x="800" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="white"><tspan x="800" dy="0">Inference output</tspan></text><rect id="ident-outcome-point-identified" x="140" y="700" width="330" height="150" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><text x="305" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white"><tspan x="305" dy="0">Point identified</tspan></text><text x="305" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="305" dy="0">A unique target value is</tspan><tspan x="305" dy="19.2">licensed under assumptions</tspan></text><path d="M 800 610 L 305 700" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="ident-outcome-partially-identified" x="550" y="700" width="330" height="150" rx="20" fill="#56a8be" stroke="none" stroke-width="0"/><text x="715" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white"><tspan x="715" dy="0">Partially identified</tspan></text><text x="715" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="715" dy="0">Report an interval or</tspan><tspan x="715" dy="19.2">identification region</tspan></text><path d="M 800 610 L 715 700" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="ident-outcome-inconclusive---abstain" x="960" y="700" width="330" height="150" rx="20" fill="#5f758a" stroke="none" stroke-width="0"/><text x="1125" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white"><tspan x="1125" dy="0">Inconclusive / abstain</tspan></text><text x="1125" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="1125" dy="0">Evidence or assumptions are</tspan><tspan x="1125" dy="19.2">insufficient for a stable claim</tspan></text><path d="M 800 610 L 1125 700" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#8467b3"><tspan x="800" dy="0">Partial identification is a scientific result, not a failure of the measurement program</tspan></text></svg>