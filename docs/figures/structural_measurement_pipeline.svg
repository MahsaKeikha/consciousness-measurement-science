<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Phenomenal structural measurement pipeline</title>
<desc id="desc">Structured first-person judgments produce a phenomenal geometry, neural and causal measurements produce a physical geometry, and a preregistered mapping is trained and evaluated on held-out relations with confound controls and perturbations.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.h{font-size:30px;font-weight:700}.b{font-size:19px;font-weight:700}.t{font-size:17px}.box{fill:#fff;stroke:#111827;stroke-width:2}.mid{fill:#f3f4f6;stroke:#374151;stroke-width:2}.line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<rect width="1200" height="620" fill="#fff"/>
<text x="55" y="55" class="h">A tractable route to the “fabric” question: test structure, not substance</text>
<rect x="60" y="125" width="260" height="105" rx="14" class="box"/><text x="190" y="162" text-anchor="middle" class="b">Phenomenal observations</text><text x="190" y="190" text-anchor="middle" class="t">similarity · order · discrimination</text><text x="190" y="214" text-anchor="middle" class="t">structured report</text>
<rect x="60" y="340" width="260" height="105" rx="14" class="box"/><text x="190" y="377" text-anchor="middle" class="b">Physical observations</text><text x="190" y="405" text-anchor="middle" class="t">population activity · connectivity</text><text x="190" y="429" text-anchor="middle" class="t">perturbational response</text>
<rect x="410" y="125" width="260" height="105" rx="14" class="mid"/><text x="540" y="166" text-anchor="middle" class="b">Phenomenal structure</text><text x="540" y="196" text-anchor="middle" class="t">metric · topology · local/global relations</text>
<rect x="410" y="340" width="260" height="105" rx="14" class="mid"/><text x="540" y="381" text-anchor="middle" class="b">Physical structure</text><text x="540" y="411" text-anchor="middle" class="t">representational / causal geometry</text>
<rect x="770" y="195" width="360" height="180" rx="18" class="box"/><text x="950" y="232" text-anchor="middle" class="b">Preregistered structure map f</text><text x="950" y="265" text-anchor="middle" class="t">train on one subset</text><text x="950" y="292" text-anchor="middle" class="t">predict held-out relations</text><text x="950" y="319" text-anchor="middle" class="t">control stimulus/semantic geometry</text><text x="950" y="346" text-anchor="middle" class="t">perturb when causal claims are made</text>
<path d="M320 177 L410 177" class="line"/><path d="M320 392 L410 392" class="line"/><path d="M670 177 L770 240" class="line"/><path d="M670 392 L770 330" class="line"/>
<rect x="325" y="510" width="550" height="70" rx="14" class="mid"/><text x="600" y="540" text-anchor="middle" class="b">Outcome: support or reject the mapping family</text><text x="600" y="565" text-anchor="middle" class="t">not “physical structure has been proven identical to experience”</text>
<path d="M950 375 L800 510" class="line"/>
</svg>
