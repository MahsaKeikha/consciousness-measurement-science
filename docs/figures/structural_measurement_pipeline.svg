<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc"><title id="title">Phenomenal structural measurement pipeline</title><desc id="desc">Four-layer preregistered workflow from phenomenal and physical observations through relational geometries, held-out correspondence testing, and support, rejection, or inconclusive outcomes.</desc><defs><marker id="arrow" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#65798d" /></marker></defs><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="0" /><text x="900" y="65" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#182433" text-anchor="middle">Structural measurement: test correspondence without assuming identity</text><text x="900" y="105" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#516274" text-anchor="middle">Four-layer preregistered workflow from observations to evidence-based conclusions</text><rect x="35" y="140" width="1730" height="195" rx="32" fill="#f8f5f6" stroke="none" stroke-width="0" /><rect x="35" y="355" width="1730" height="215" rx="32" fill="#f3f8fb" stroke="none" stroke-width="0" /><rect x="35" y="590" width="1730" height="215" rx="32" fill="#f6f4fb" stroke="none" stroke-width="0" /><rect x="35" y="825" width="1730" height="245" rx="32" fill="#f4f8f3" stroke="none" stroke-width="0" /><text x="75" y="185" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2f4d6a" text-anchor="start">LAYER 1</text><text x="75" y="222" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#182433" text-anchor="start">OBSERVATIONS</text><text x="75" y="255" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516274" text-anchor="start">Independent data sources</text><text x="75" y="400" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2f4d6a" text-anchor="start">LAYER 2</text><text x="75" y="437" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#182433" text-anchor="start">RELATIONAL</text><text x="75" y="468" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#182433" text-anchor="start">GEOMETRIES</text><text x="75" y="503" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516274" text-anchor="start">Reliability-audited relations</text><text x="75" y="635" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2f4d6a" text-anchor="start">LAYER 3</text><text x="75" y="672" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#182433" text-anchor="start">PREREGISTERED</text><text x="75" y="702" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#182433" text-anchor="start">TEST</text><text x="75" y="737" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516274" text-anchor="start">Held-out mapping evaluation</text><text x="75" y="870" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2f4d6a" text-anchor="start">LAYER 4</text><text x="75" y="907" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#182433" text-anchor="start">EVALUATION</text><text x="75" y="940" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516274" text-anchor="start">Evidence-based outcomes</text><rect x="360" y="170" width="545" height="140" rx="24" fill="#bf6178" stroke="none" stroke-width="0" data-node="phenomenal-observations" /><text x="632.5" y="219" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle" data-parent="phenomenal-observations">Phenomenal observations</text><text x="632.5" y="258" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="phenomenal-observations">Similarity and discrimination</text><text x="632.5" y="287" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="phenomenal-observations">Ordering and structured report</text><rect x="1080" y="170" width="545" height="140" rx="24" fill="#3f79aa" stroke="none" stroke-width="0" data-node="physical-observations" /><text x="1352.5" y="219" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle" data-parent="physical-observations">Physical / neural observations</text><text x="1352.5" y="258" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="physical-observations">Population activity and connectivity</text><text x="1352.5" y="287" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="physical-observations">Perturbational response and trajectories</text><rect x="360" y="395" width="545" height="145" rx="24" fill="#df7f30" stroke="none" stroke-width="0" data-node="phenomenal-geometry" /><text x="632.5" y="444" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle" data-parent="phenomenal-geometry">Phenomenal geometry</text><text x="632.5" y="483" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="phenomenal-geometry">Phenomenal distance matrix D_E</text><text x="632.5" y="512" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="phenomenal-geometry">Reliability and held-out judgments</text><rect x="1080" y="395" width="545" height="145" rx="24" fill="#59a9bf" stroke="none" stroke-width="0" data-node="neural-geometry" /><text x="1352.5" y="444" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle" data-parent="neural-geometry">Neural geometry</text><text x="1352.5" y="483" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="neural-geometry">Neural distance matrix D_N</text><text x="1352.5" y="512" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="neural-geometry">Matched physical relations</text><rect x="665" y="630" width="700" height="145" rx="24" fill="#8165ad" stroke="none" stroke-width="0" data-node="mapping" /><text x="1015.0" y="679" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle" data-parent="mapping">Preregistered mapping family F</text><text x="1015.0" y="718" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="mapping">Fit f: N -&gt; E on training relations</text><text x="1015.0" y="747" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="white" text-anchor="middle" data-parent="mapping">Held-out distortion and permutation null</text><rect x="345" y="880" width="360" height="135" rx="24" fill="#5da36a" stroke="none" stroke-width="0" data-node="support" /><text x="525.0" y="929" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" data-parent="support">Supports mapping family</text><text x="525.0" y="968" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" data-parent="support">Low held-out distortion</text><text x="525.0" y="994" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" data-parent="support">Reliability + null rejection</text><rect x="760" y="880" width="360" height="135" rx="24" fill="#c45f78" stroke="none" stroke-width="0" data-node="reject" /><text x="940.0" y="929" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" data-parent="reject">Rejects mapping family</text><text x="940.0" y="968" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" data-parent="reject">High held-out distortion</text><text x="940.0" y="994" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" data-parent="reject">or null-level alignment</text><rect x="1175" y="880" width="360" height="135" rx="24" fill="#60758a" stroke="none" stroke-width="0" data-node="inconclusive" /><text x="1355.0" y="929" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" data-parent="inconclusive">Inconclusive</text><text x="1355.0" y="968" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="white" text-anchor="middle" data-parent="inconclusive">Low reliability or model conflict</text><text x="1355.0" y="993.5" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="white" text-anchor="middle" data-parent="inconclusive">or wide uncertainty</text><line x1="632.5" y1="310" x2="632.5" y2="395" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="1352.5" y1="310" x2="1352.5" y2="395" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M 632.5 540 L 632.5 575 L 850 575 L 850 630" fill="none" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 1352.5 540 L 1352.5 575 L 1180 575 L 1180 630" fill="none" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><line x1="1015" y1="775" x2="1015" y2="825" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" /><line x1="525" y1="825" x2="1355" y2="825" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" /><line x1="525" y1="825" x2="525" y2="880" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="940" y1="825" x2="940" y2="880" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="1355" y1="825" x2="1355" y2="880" stroke="#65798d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="210" y="1090" width="1380" height="75" rx="22" fill="#f7f9fb" stroke="#d8e1ea" stroke-width="2" /><text x="900" y="1120" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#243d56" text-anchor="middle">Primary statistic: mean held-out absolute mismatch between normalized phenomenal and mapped neural distances</text><text x="900" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516274" text-anchor="middle">Support, rejection, and inconclusive outcomes are all permitted without assuming ontological identity.</text></svg>