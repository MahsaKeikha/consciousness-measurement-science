<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Validation program map</title><desc id="desc">Staged validation program from benchmark reporting through confound controls, state transport, perturbation, clinical stress tests, structural prediction, and adversarial theory testing.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0.8,0.8 L7.2,4 L0.8,7.2 z" fill="#6c7f91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Validation program: from benchmark conditions to adversarial theory tests</tspan></text><text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5f758a"><tspan x="800" dy="0">Each stage adds a different kind of evidential burden</tspan></text><rect id="validation-1" x="80" y="210" width="320" height="190" rx="20" fill="#3576a8" stroke="none" stroke-width="0"/><rect x="100" y="230" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="124" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#3576a8"><tspan x="124" dy="0">1</tspan></text><text x="255" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="255" dy="0">Benchmark report</tspan></text><text x="240" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="240" dy="0">Healthy waking</tspan><tspan x="240" dy="18.0">trial-level report</tspan></text><path d="M 400 305 L 460 305" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-2" x="460" y="210" width="320" height="190" rx="20" fill="#56a8be" stroke="none" stroke-width="0"/><rect x="480" y="230" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="504" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#56a8be"><tspan x="504" dy="0">2</tspan></text><text x="635" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="635" dy="0">Confound separation</tspan></text><text x="620" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="620" dy="0">Masking, rivalry, no-report</tspan><tspan x="620" dy="18.0">attention and memory controls</tspan></text><path d="M 780 305 L 840 305" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-3" x="840" y="210" width="320" height="190" rx="20" fill="#8467b3" stroke="none" stroke-width="0"/><rect x="860" y="230" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="884" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#8467b3"><tspan x="884" dy="0">3</tspan></text><text x="1015" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="1015" dy="0">State transport</tspan></text><text x="1000" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="1000" dy="0">Sleep, anesthesia,</tspan><tspan x="1000" dy="18.0">dissociation</tspan></text><path d="M 1160 305 L 1220 305" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-4" x="1220" y="210" width="320" height="190" rx="20" fill="#df8234" stroke="none" stroke-width="0"/><rect x="1240" y="230" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="1264" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#df8234"><tspan x="1264" dy="0">4</tspan></text><text x="1395" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="1395" dy="0">Causal perturbation</tspan></text><text x="1380" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="1380" dy="0">TMS, stimulation, lesions,</tspan><tspan x="1380" dy="18.0">pharmacological interventions</tspan></text><path d="M 1380 400 L 1380 435 L 240 435 L 240 480" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-5" x="80" y="480" width="320" height="190" rx="20" fill="#c2617b" stroke="none" stroke-width="0"/><rect x="100" y="500" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="124" y="533" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#c2617b"><tspan x="124" dy="0">5</tspan></text><text x="255" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="255" dy="0">Clinical stress test</tspan></text><text x="240" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="240" dy="0">Serial assessment,</tspan><tspan x="240" dy="18.0">discordant channels</tspan></text><path d="M 400 575 L 460 575" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-6" x="460" y="480" width="320" height="190" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><rect x="480" y="500" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="504" y="533" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#62a66a"><tspan x="504" dy="0">6</tspan></text><text x="635" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="635" dy="0">Structural prediction</tspan></text><text x="620" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="620" dy="0">Held-out phenomenal</tspan><tspan x="620" dy="18.0">geometry prediction</tspan></text><path d="M 780 575 L 840 575" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="validation-7" x="840" y="480" width="320" height="190" rx="20" fill="#17324d" stroke="none" stroke-width="0"/><rect x="860" y="500" width="48" height="48" rx="24" fill="white" stroke="none" stroke-width="0"/><text x="884" y="533" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#17324d"><tspan x="884" dy="0">7</tspan></text><text x="1015" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="white"><tspan x="1015" dy="0">Adversarial theory test</tspan></text><text x="1000" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="white"><tspan x="1000" dy="0">Preregistered divergent</tspan><tspan x="1000" dy="18.0">predictions among rivals</tspan></text><text x="800" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Promotion rule: stronger claims require broader validation, not only a higher in-sample score</tspan></text><text x="800" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#c2617b"><tspan x="800" dy="0">Clinical and noncommunicative use remain validation domains, not shortcuts to a binary consciousness classifier</tspan></text></svg>