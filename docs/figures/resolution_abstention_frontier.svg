<line class="axis" x1="110" y1="615" x2="1145" y2="615"/>
<line class="axis" x1="110" y1="105" x2="110" y2="615"/>
<text class="label" x="627.5" y="690" text-anchor="middle">deployment sample size n</text>
<text class="label" transform="translate(31 360.0) rotate(-90)" text-anchor="middle">fraction of runs meeting resolution criterion</text>
<polyline class="lineA" points="110.0,615.0 225.0,615.0 340.0,615.0 455.0,388.7 685.0,105.0 1145.0,105.0"/>
<circle class="dotA" cx="110.0" cy="615.0" r="4.5"/>
