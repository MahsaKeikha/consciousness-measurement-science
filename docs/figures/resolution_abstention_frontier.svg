<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Predeclared resolution threshold creates an explicit abstention frontier</title>
<desc id="desc">A result is released only when the simultaneous finite-sample interval width is at most 0.28; otherwise the pipeline abstains.</desc>
<style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}.axis{stroke:#334155;stroke-width:1.4}.grid{stroke:#e2e8f0;stroke-width:1}.title{font:700 24px Arial,Helvetica,sans-serif;fill:#0f172a}.subtitle{font:14px Arial,Helvetica,sans-serif;fill:#475569}.label{font:600 15px Arial,Helvetica,sans-serif;fill:#1e293b}.tick{font:13px Arial,Helvetica,sans-serif;fill:#475569}.lineA{fill:none;stroke:#0f5f78;stroke-width:3}.lineB{fill:none;stroke:#9a4e0d;stroke-width:3}.lineC{fill:none;stroke:#6b4fa3;stroke-width:3}.dotA{fill:#0f5f78}.dotB{fill:#9a4e0d}.band{fill:#dceef3;stroke:none}.ref{stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 6}.note{font:13px Arial,Helvetica,sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1}
</style>
<rect class="bg" width="1200" height="720"/>
<text class="title" x="110" y="42">Predeclared resolution threshold creates an explicit abstention frontier</text>
<text class="subtitle" x="110" y="68">A result is released only when the simultaneous finite-sample interval width is at most 0.28; otherwise the pipeline abstains.</text>
<rect class="panel" x="110" y="105" width="1035" height="510" rx="8"/>
<line class="grid" x1="110" y1="615.0" x2="1145" y2="615.0"/>
<text class="tick" x="96" y="619.0" text-anchor="end">0</text>
<line class="grid" x1="110" y1="513.0" x2="1145" y2="513.0"/>
<text class="tick" x="96" y="517.0" text-anchor="end">0.2</text>
<line class="grid" x1="110" y1="411.0" x2="1145" y2="411.0"/>
<text class="tick" x="96" y="415.0" text-anchor="end">0.4</text>
<line class="grid" x1="110" y1="309.0" x2="1145" y2="309.0"/>
<text class="tick" x="96" y="313.0" text-anchor="end">0.6</text>
<line class="grid" x1="110" y1="207.0" x2="1145" y2="207.0"/>
<text class="tick" x="96" y="211.0" text-anchor="end">0.8</text>
<line class="grid" x1="110" y1="105.0" x2="1145" y2="105.0"/>
<text class="tick" x="96" y="109.0" text-anchor="end">1</text>
<line class="grid" x1="110.0" y1="105" x2="110.0" y2="615"/>
<text class="tick" x="110.0" y="642" text-anchor="middle">250</text>
<line class="grid" x1="225.0" y1="105" x2="225.0" y2="615"/>
<text class="tick" x="225.0" y="642" text-anchor="middle">500</text>
<line class="grid" x1="340.0" y1="105" x2="340.0" y2="615"/>
<text class="tick" x="340.0" y="642" text-anchor="middle">750</text>
<line class="grid" x1="455.0" y1="105" x2="455.0" y2="615"/>
<text class="tick" x="455.0" y="642" text-anchor="middle">1000</text>
<line class="grid" x1="685.0" y1="105" x2="685.0" y2="615"/>
<text class="tick" x="685.0" y="642" text-anchor="middle">1500</text>
