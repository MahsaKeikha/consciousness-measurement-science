<line x1="138" y1="700" x2="642" y2="700" stroke="#8f9cad" stroke-width="1.4"/>
<line x1="138" y1="685.8456608034593" x2="642" y2="685.8456608034593" stroke="#aeb8c5" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="640" y="677.8456608034593" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#778394">rank floor 0.7071</text>
<polyline points="138.0,685.8 306.0,685.6 474.0,672.3 642.0,482.7" fill="none" stroke="#1f6078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
