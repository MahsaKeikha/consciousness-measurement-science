<line x1="808" y1="545.3529411764706" x2="1312" y2="545.3529411764706" stroke="#e3e8ef" stroke-width="1"/>
<text x="796" y="550.3529411764706" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#657286">3</text>
<line x1="808" y1="475.05882352941177" x2="1312" y2="475.05882352941177" stroke="#e3e8ef" stroke-width="1"/>
<text x="796" y="480.05882352941177" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#657286">4</text>
