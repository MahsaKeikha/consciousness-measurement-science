<text x="1060" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f5e72">common-noise correlation</text>
<text x="756" y="762" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f5e72">CRLB variance: 0.25 to 0.925</text>
<line x1="60" y1="840" x2="1340" y2="840" stroke="#d6dde7" stroke-width="1"/>
<text x="60" y="860" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#697587">Deterministic synthetic validation. These results quantify measurement limits.</text>
<text x="60" y="878" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#697587">They do not identify consciousness or qualia.</text>
</svg>