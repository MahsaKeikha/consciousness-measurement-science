<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60" y="56" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3156a3">Research III V26-V30</text>
<text x="60" y="92" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#172236">Electromagnetic resolution and information limits</text>
<text x="60" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#657286">Noise geometry, inverse leakage, information loss, aliasing,</text>
<text x="60" y="140" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#657286">and unstable inverse directions.</text>
<line x1="60" y1="155" x2="1340" y2="155" stroke="#d6dde7" stroke-width="1.2"/>
<rect x="60" y="172" width="400" height="150" rx="12" fill="#ffffff" stroke="#d6dde7" stroke-width="1.2"/>
<text x="82" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#315b78">V26</text>
<text x="82" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Whitening identity</text>
<text x="82" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#315b78">2.78e-17</text>
<text x="82" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">weighted energy equals whitened energy</text>
<rect x="500" y="172" width="400" height="150" rx="12" fill="#ffffff" stroke="#d6dde7" stroke-width="1.2"/>
<text x="522" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#51683f">V29</text>
<text x="522" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Temporal aliasing</text>
<text x="522" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#51683f">17 Hz = 83 Hz @ 100 Hz</text>
<text x="522" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">max sampled difference 1.39e-13</text>
<rect x="940" y="172" width="400" height="150" rx="12" fill="#ffffff" stroke="#d6dde7" stroke-width="1.2"/>
<text x="962" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7a425c">V30</text>
<text x="962" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#182437">Inverse amplification</text>
<text x="962" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7a425c">100x</text>
<text x="962" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#637083">at smallest singular value 0.01</text>
<rect x="60" y="365" width="610" height="430" rx="12" fill="#fbfcfe" stroke="#d6dde7" stroke-width="1.2"/>
<text x="86" y="401" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#244c64">V27  Resolution leakage</text>
<text x="86" y="426" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#687588">Identity error as regularization increases</text>
<line x1="138" y1="700" x2="642" y2="700" stroke="#e3e8ef" stroke-width="1"/>
<text x="126" y="705" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#657286">0.70</text>
<line x1="138" y1="620.3333333333333" x2="642" y2="620.3333333333333" stroke="#e3e8ef" stroke-width="1"/>
<text x="126" y="625.3333333333333" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#657286">0.74</text>
<line x1="138" y1="540.6666666666665" x2="642" y2="540.6666666666665" stroke="#e3e8ef" stroke-width="1"/>
<text x="126" y="545.6666666666665" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#657286">0.78</text>
