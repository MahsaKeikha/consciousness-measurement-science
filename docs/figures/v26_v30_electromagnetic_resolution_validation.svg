<circle cx="306" cy="685.647116628185" r="5.5" fill="#1f6078"/>
<circle cx="474" cy="672.2851704889115" r="5.5" fill="#1f6078"/>
<circle cx="642" cy="482.731236272551" r="5.5" fill="#1f6078"/>
<text x="138" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#657286">1e-4</text>
<text x="306" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#657286">1e-2</text>
<text x="474" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#657286">0.1</text>
<text x="642" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#657286">1</text>
<text x="390" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f5e72">regularization</text>
<text x="86" y="762" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f5e72">Result: leakage persists and worsens under stronger regularization.</text>
<rect x="730" y="365" width="610" height="430" rx="12" fill="#fbfcfe" stroke="#d6dde7" stroke-width="1.2"/>
<text x="756" y="401" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#415f46">V28  Fisher information under common sensor noise</text>
<text x="756" y="426" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#687588">Information decreases as common-noise correlation increases</text>
