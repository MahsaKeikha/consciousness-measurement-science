<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="85" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#13243a">Research III V36-V40: finite-sample electromagnetic inference</text>
  <text x="85" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#46586c">Efficient amplitude inference, inverse-covariance bias, Gaussian discrimination, multiplicity control, and covariance-mismatch calibration.</text>

  <rect x="85" y="155" width="455" height="245" rx="20" fill="#f5f8fb" stroke="#c7d3df" stroke-width="2"/>
  <text x="120" y="202" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#173b63">V36 GLS efficiency and coverage</text>
  <text x="120" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Exact variance / CRLB</text>
  <text x="500" y="250" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#173b63">0.783289817</text>
  <text x="120" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Empirical variance</text>
  <text x="500" y="296" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#173b63">0.784475837</text>
  <text x="120" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Empirical 95% coverage</text>
  <text x="500" y="342" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#173b63">0.947775</text>
  <text x="120" y="375" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7785">Fixed seed 20260918 with 40,000 Gaussian trials.</text>

  <rect x="570" y="155" width="455" height="245" rx="20" fill="#f7f8f4" stroke="#ced4c2" stroke-width="2"/>
  <text x="605" y="202" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#3b5b32">V37 inverse covariance bias</text>
  <text x="605" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Dimension p</text>
  <text x="985" y="250" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3b5b32">4</text>
  <text x="605" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Bias factor at nu = 6</text>
  <text x="985" y="296" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3b5b32">6</text>
  <text x="605" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Bias factor at nu = 50</text>
  <text x="985" y="342" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3b5b32">1.111111111</text>
  <text x="605" y="375" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7785">Finite noise samples can systematically inflate estimated precision.</text>

  <rect x="1055" y="155" width="460" height="245" rx="20" fill="#faf6f8" stroke="#d8c8d0" stroke-width="2"/>
  <text x="1090" y="202" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#6a3f57">V40 covariance mismatch</text>
  <text x="1090" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Oracle exact / nominal ratio</text>
  <text x="1470" y="250" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6a3f57">1</text>
  <text x="1090" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Identity-weight ratio</text>
  <text x="1470" y="296" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6a3f57">1.3312</text>
  <text x="1090" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">Diagonal-weight ratio</text>
  <text x="1470" y="342" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6a3f57">1.330058939</text>
  <text x="1090" y="375" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7785">Misspecified noise weighting can understate uncertainty by about 33% here.</text>

  <rect x="85" y="440" width="680" height="455" rx="20" fill="#fbfbfc" stroke="#d4d9df" stroke-width="2"/>
  <text x="120" y="487" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#294f64">V38 Gaussian source discrimination</text>
  <text x="120" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b6c7c">Equal-prior Bayes error falls exactly with Mahalanobis separation.</text>
  <text x="120" y="610" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">d squared = 0</text>
  <text x="430" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#294f64">error = 0.5</text>
  <text x="120" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">d squared = 9</text>
  <text x="430" y="655" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#294f64">error = 0.066807201</text>
  <line x1="465" y1="805" x2="705" y2="805" stroke="#8795a5" stroke-width="2"/>
  <line x1="465" y1="570" x2="465" y2="805" stroke="#8795a5" stroke-width="2"/>
  <polyline points="465.00,570.00 471.67,616.39 491.67,659.99 571.67,730.43 705.00,773.60" fill="none" stroke="#294f64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="465" cy="570" r="5" fill="#fff" stroke="#294f64" stroke-width="3"/>
  <circle cx="471.67" cy="616.39" r="5" fill="#fff" stroke="#294f64" stroke-width="3"/>
  <circle cx="491.67" cy="659.99" r="5" fill="#fff" stroke="#294f64" stroke-width="3"/>
  <circle cx="571.67" cy="730.43" r="5" fill="#fff" stroke="#294f64" stroke-width="3"/>
  <circle cx="705" cy="773.60" r="5" fill="#fff" stroke="#294f64" stroke-width="3"/>
  <text x="585" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#46586c">Mahalanobis distance squared</text>

  <rect x="795" y="440" width="720" height="455" rx="20" fill="#f8faf8" stroke="#ced8ce" stroke-width="2"/>
  <text x="830" y="487" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#43634a">V39 exact independent-search FWER control</text>
  <text x="830" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b6c7c">The two-sided z threshold rises as the number of searched locations rises.</text>
  <text x="830" y="610" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">1 comparison</text>
  <text x="1160" y="610" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#43634a">1.959963985</text>
  <text x="830" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34495e">1000 comparisons</text>
  <text x="1160" y="655" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#43634a">4.04966055</text>
  <line x1="1205" y1="805" x2="1490" y2="805" stroke="#8795a5" stroke-width="2"/>
  <line x1="1205" y1="570" x2="1205" y2="805" stroke="#8795a5" stroke-width="2"/>
  <polyline points="1205.00,798.59 1300.00,708.90 1395.00,636.87 1490.00,575.38" fill="none" stroke="#43634a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1205" cy="798.59" r="5" fill="#fff" stroke="#43634a" stroke-width="3"/>
  <circle cx="1300" cy="708.90" r="5" fill="#fff" stroke="#43634a" stroke-width="3"/>
  <circle cx="1395" cy="636.87" r="5" fill="#fff" stroke="#43634a" stroke-width="3"/>
  <circle cx="1490" cy="575.38" r="5" fill="#fff" stroke="#43634a" stroke-width="3"/>
  <text x="1348" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#46586c">log10 comparison count</text>

  <text x="85" y="944" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6a7684">Analytic and fixed-seed synthetic inference validation. No human empirical data.</text>
  <text x="85" y="966" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6a7684">No direct measurement of consciousness or qualia.</text>
</svg>
