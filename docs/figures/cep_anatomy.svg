<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Consciousness Evidence Profile anatomy</title><desc id="desc">Components of the CEP record and how target, evidence, assumptions, uncertainty, and claim ceiling connect.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6c7f91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Consciousness Evidence Profile: anatomy of an auditable record</tspan></text><text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5f758a"><tspan x="800" dy="0">The profile stays structured before any optional scalar summary</tspan></text><rect id="cep-core" x="585" y="380" width="430" height="210" rx="28" fill="#17324d" stroke="none" stroke-width="0"/><text x="800" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="white"><tspan x="800" dy="0">CEP(s, t, target, context)</tspan></text><text x="800" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="white"><tspan x="800" dy="0">Evidence vector v</tspan><tspan x="800" dy="20.4">Quality flags q</tspan><tspan x="800" dy="20.4">Uncertainty u</tspan><tspan x="800" dy="20.4">Assumptions A</tspan><tspan x="800" dy="20.4">Validation domain D</tspan><tspan x="800" dy="20.4">Allowed claim Gamma</tspan></text><rect id="cep-declared-target" x="120" y="210" width="400" height="140" rx="20" fill="#c2617b" stroke="none" stroke-width="0"/><text x="320" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="320" dy="0">Declared target</tspan></text><text x="320" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="320" dy="0">Presence, state, content,</tspan><tspan x="320" dy="19.2">structure, or capacity</tspan></text><path d="M 320 350 L 800 380" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="cep-evidence-channels" x="580" y="190" width="400" height="140" rx="20" fill="#3576a8" stroke="none" stroke-width="0"/><text x="780" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="780" dy="0">Evidence channels</tspan></text><text x="780" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="780" dy="0">Report, behavior, neural,</tspan><tspan x="780" dy="19.2">perturbation, physiology</tspan></text><path d="M 780 330 L 800 380" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="cep-quality-and-context" x="1080" y="210" width="400" height="140" rx="20" fill="#df8234" stroke="none" stroke-width="0"/><text x="1280" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="1280" dy="0">Quality + context</tspan></text><text x="1280" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="1280" dy="0">Acquisition quality, confounds,</tspan><tspan x="1280" dy="19.2">hardware and task conditions</tspan></text><path d="M 1280 350 L 800 380" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="cep-assumptions" x="120" y="680" width="400" height="140" rx="20" fill="#d59d33" stroke="none" stroke-width="0"/><text x="320" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="320" dy="0">Assumptions</tspan></text><text x="320" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="320" dy="0">Dependence, calibration,</tspan><tspan x="320" dy="19.2">transport and missingness</tspan></text><path d="M 320 680 L 800 590" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="cep-uncertainty" x="580" y="700" width="400" height="140" rx="20" fill="#56a8be" stroke="none" stroke-width="0"/><text x="780" y="745" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="780" dy="0">Uncertainty</tspan></text><text x="780" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="780" dy="0">Intervals, identification regions,</tspan><tspan x="780" dy="19.2">abstention triggers</tspan></text><path d="M 780 700 L 800 590" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><rect id="cep-claim-ceiling" x="1080" y="680" width="400" height="140" rx="20" fill="#62a66a" stroke="none" stroke-width="0"/><text x="1280" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="white"><tspan x="1280" dy="0">Claim ceiling</tspan></text><text x="1280" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="white"><tspan x="1280" dy="0">Strongest M0-M7 statement</tspan><tspan x="1280" dy="19.2">licensed by the evidence</tspan></text><path d="M 1280 680 L 800 590" fill="none" stroke="#6c7f91" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#172033"><tspan x="800" dy="0">Design rule: uncertainty and assumptions travel with the claim, not in a footnote after the fact</tspan></text></svg>