name: refresh-partial-identification-readme

on:
  push:
    branches: ["dependence-robust-partial-identification"]
    paths:
      - "scripts/refresh_partial_identification_readme.py"
      - ".github/workflows/refresh-partial-identification-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: dependence-robust-partial-identification

      - name: Synchronize README
        run: |
          python scripts/refresh_partial_identification_readme.py
          git diff --check

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Expose dependence-robust partial identification"
          git push origin HEAD:dependence-robust-partial-identification
